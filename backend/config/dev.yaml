version: "1.0.0"

http:
  host: "0.0.0.0"
  port: 8080
  readTimeout: 5s
  writeTimeout: 5s
  idleTimeout: 30s

postgres:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "media"
  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifetime: 1h

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  dialTimeout: 5s
  readTimeout: 5s
  writeTimeout: 5s
  poolSize: 10

clip:
  baseURL: "http://localhost:8001"
  timeout: 5s
  maxIdleConn: 10

faiss:
  host: "localhost"
  port: 8002
  timeout: 5s

log:
  level: "debug"
  format: "text"
  sourceFolder: "backend"
