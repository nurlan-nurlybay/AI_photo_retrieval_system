version: "1.0.0"

http:
  host: "0.0.0.0"
  port: 8080
  readTimeout: "10s"
  writeTimeout: "10s"
  idleTimeout: "60s"

postgres:
  host: "postgres"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "media"
  sslmode: "disable"
  maxOpenConns: 25
  maxIdleConns: 5
  connMaxLifetime: "1h"
  connMaxIdleTime: "10m"
  healthCheckPeriod: "5m"

redis:
  addr: "redis:6379"
  password: ""
  db: 0
  dialTimeout: "5s"
  readTimeout: "3s"
  writeTimeout: "3s"
  poolSize: 10

seaweedfs:
  baseURL: "http://seaweedfs:8888"
  publicURL: "http://localhost:8888"

clip:
  host: "ml_service"
  port: 8003

faiss:
  host: "vector_service"
  port: 8002

log:
  level: "info"
  format: "json"
  sourceFolder: "backend"
