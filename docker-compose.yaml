services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photo-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - clip_service
      - faiss_service
    environment:
      - CONFIG=config.yaml
    networks:
      - ai_net

  postgres:
    image: postgres:16-alpine
    container_name: media_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ai_net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ai_net

  clip_service:
    build: ./ml_service
    container_name: clip-service
    ports:
      - "8001:8001"
    networks:
      - ai_net

  faiss_service:
    build: ./vector_service
    container_name: faiss-service
    ports:
      - "8002:8002"
    networks:
      - ai_net

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    command: "server -dir=/data -s3"
    ports:
      - "9333:9333"   # master API (dir/assign)
      - "8080:8080"   # volume server
      - "8333:8333"   # S3 API (optional)
    volumes:
      - ./seaweed_data:/data
    networks:
      - ai_net


volumes:
  pg_data:

networks:
  ai_net:
    driver: bridge
