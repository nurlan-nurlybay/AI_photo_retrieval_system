name: ai-photo-retrieval

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-api
    command: [ "./photo-backend", "--config=/config/docker.yaml" ]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      seaweedfs:
        condition: service_started
      ml_service:
        condition: service_healthy
      vector_service:
        condition: service_started
    environment:
      - CONFIG_PATH=/config/docker.yaml
    env_file:
      - .env
    volumes:
      - ./backend/config:/config
    networks:
      - clip-net

  postgres:
    image: postgres:15
    container_name: pg
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=media
    volumes:
      - ./volumes/pg:/var/lib/postgresql/data
    networks: [ clip-net ]

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    command: "server -dir=/data -volume.max=10 -filer -s3"
    user: "0:0"
    ports:
      - "9333:9333" # master
      - "8888:8888" # filer (HTTP file API)
      - "8333:8333" # S3 gateway
      - "18080:18080" # volume UI
    volumes:
      - ./seaweed-data:/data
    networks: [ clip-net ]

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6380:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    networks: [ clip-net ]

  ml_service:
    build:
      context: ./ml_service
      args:
        - HF_TOKEN=${HF_TOKEN}
    container_name: ml-service
    ports:
      - "8005:8003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - HF_HOME=/app/models
      - HF_TOKEN=${HF_TOKEN}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - clip-net

  vector_service:
    build: ./vector_service
    container_name: vector-service
    expose: [ "8002" ]
    ports: [ "8006:8002" ]
    environment:
      - MILVUS_HOST=${MILVUS_HOST:-milvus-standalone}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - VECTOR_DIM=${VECTOR_DIM:-1152}
      - PORT=${PORT:-8002}
    depends_on:
      milvus:
        condition: service_healthy
    networks: [ clip-net ]

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    networks: [ clip-net ]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: milvus-minio
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    networks: [ clip-net ]

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: milvus-standalone
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
    depends_on:
      - "etcd"
      - "minio"
    networks: [ clip-net ]

networks:
  clip-net:
    name: clip-net

volumes:
  redis-data:


