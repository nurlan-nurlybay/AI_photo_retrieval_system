version: "3.9"

name: ai-photo-retrieval

services:
  ml_service:
    build:
      context: ./ml_service
    container_name: ml-service
    ports:
      - "8003:8003"
    # If you don't have any env vars, either remove 'environment' entirely or leave it as an empty map:
    environment: {}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/docs"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [clip-net]

  vector_service:
    build:
      context: ./vector_service
    container_name: vector-service
    ports:
      - "8002:8002"
    environment: {}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/docs"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [clip-net]

  temp_webapp:
    build:
      context: ./temp_webapp
    container_name: temp-webapp
    ports:
      - "5000:5000"
    environment:
      ML_URL: "http://ml_service:8003"
      VS_URL: "http://vector_service:8002"
    depends_on:
      - ml_service
      - vector_service
    restart: unless-stopped
    networks: [clip-net]

networks:
  clip-net:
    name: clip-net
