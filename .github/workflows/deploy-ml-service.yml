name: Deploy ML Service

on:
  push:
    branches: [ main ]
    paths:
      - 'ml_service/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- STEP A: Setup Python environment ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- STEP B: Install Dependencies for Testing ---
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx  # Add other light deps needed for unit tests
          # Note: We don't install Torch/Transformers here because 
          # GitHub runners don't have GPUs and it's too slow.
          # We use "Mocks" in our tests.

      # --- STEP C: Run Tests ---
      - name: Run Pytest
        run: |
          # Only run unit tests that don't require a GPU
          cd ml_service && python -m pytest tests/

      # --- STEP D: If tests pass, Log in & Build ---
      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: nurlannurlybay
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          push: true
          tags: nurlannurlybay/ml_service:latest

      - name: Vast.ai Update
        if: success()
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          pip install vastai
          echo "Triggering Vast restart..."
          # vastai update endpoint ...

