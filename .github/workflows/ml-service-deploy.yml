name: Deploy ML Service

on:
  push:
    branches: [ main ]
    paths:
      - 'ml_service/**'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- STEP A: Setup Python environment ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- STEP B: Install Dependencies for Testing ---
      - name: Install Dependencies
        working-directory: ./ml_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      # --- STEP C: Run Tests ---
      - name: Run Pytest
        working-directory: ./ml_service
        run: |
          # Only run unit tests that don't require a GPU
          python -m pytest tests/

      # --- STEP D: If tests pass, Log in & Build ---
      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          push: true
          tags: nurlannurlybay/ml_service:latest
          build-args: HF_TOKEN=${{ secrets.HF_TOKEN }}

